<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattern Recall | Arcade Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
 <link rel="icon" type="image/png" href="../../assests/icons/icons.png.png" />
<link rel="stylesheet" href="../../css/main.css">
<script src="../../js/shared/sound.js"></script>
<style>
  :root {
    --bg: #05060f;
    --cyan: #35f4e0;
    --pink: #ff5ec4;
    --purple: #b565ff;
    --text: #e8ecff;
    --muted: #8b93b8;
    --metal-1: #2b2f3d;
    --metal-2: #14161f;
    --amber: #ffb020;
    --red: #ff4d5e;
    --blue: #3b82f6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #14182c 0%, var(--bg) 65%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  body { display: flex; align-items: center; justify-content: center; padding: 20px 10px; }

  .cabinet {
    width: 100%;
    max-width: 620px;
    background: linear-gradient(160deg, var(--metal-1), var(--metal-2) 60%);
    border-radius: 26px;
    padding: 16px;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55), 0 0 40px rgba(53,244,224,0.06);
  }
  .bolt {
    position: absolute; width: 9px; height: 9px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #666, #1a1a1a 70%);
    box-shadow: 0 0 0 2px rgba(0,0,0,0.4);
  }
  .bolt.tl{top:12px;left:12px}.bolt.tr{top:12px;right:12px}
  .bolt.bl{bottom:12px;left:12px}.bolt.br{bottom:12px;right:12px}

  .header-screen {
    background: #05070d;
    border-radius: 14px;
    padding: 18px 16px 14px;
    text-align: center;
    border: 1px solid #1c2030;
    box-shadow: inset 0 0 24px rgba(0,0,0,0.8);
  }
  h1 {
    font-size: clamp(1.5rem, 6vw, 2.3rem);
    letter-spacing: 3px;
    margin: 0;
    font-weight: 900;
    background: linear-gradient(90deg, var(--cyan), var(--purple) 55%, var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 24px rgba(53,244,224,0.3);
  }

  .info-bar {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between;
    margin: 12px 0; align-items: stretch;
  }
  .panel {
    background: #0a0d18; border: 1px solid #232a4d; border-radius: 10px;
    padding: 8px 12px; font-size: 0.8rem; color: var(--muted); flex: 1 1 auto;
    display: flex; flex-direction: column; justify-content: center; min-width: 130px;
  }
  .panel.hint { flex: 1 1 180px; }
  .score-pair { display: flex; gap: 8px; }
  .score-box {
    background: #05070d; border: 1px solid #232a4d; border-radius: 8px;
    padding: 6px 12px; text-align: center; min-width: 74px;
  }
  .score-box .label { font-size: 0.62rem; letter-spacing: 1px; color: var(--muted); }
  .score-box .value { font-size: 1.15rem; font-weight: 800; }
  .score-box.you .value { color: var(--amber); text-shadow: 0 0 8px rgba(255,176,32,0.5); }
  .score-box.opp .value { color: var(--blue); text-shadow: 0 0 8px rgba(59,130,246,0.5); }
  .turn-tag { font-size: 0.65rem; color: var(--cyan); margin-top: 2px; }

  .stats-row { display: flex; gap: 8px; }
  .stat-box {
    background: #05070d; border: 1px solid #232a4d; border-radius: 8px;
    padding: 6px 10px; text-align: center; min-width: 58px; flex: 1;
  }
  .stat-box .label { font-size: 0.6rem; color: var(--muted); letter-spacing: 1px; }
  .stat-box .value { font-size: 1.05rem; font-weight: 800; color: var(--text); }

  .screen {
    background: #04060b; border-radius: 18px; padding: 22px;
    display: flex; justify-content: center;
    border: 1px solid #171b2b;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.85);
    position: relative;
  }
  .screen::before {
    content: ""; position: absolute; inset: 8px; border-radius: 14px;
    border: 2px solid var(--cyan); box-shadow: 0 0 24px rgba(53,244,224,0.4), 0 0 50px rgba(255,94,196,0.15);
    pointer-events: none;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(78px, 104px));
    grid-template-rows: repeat(3, minmax(78px, 104px));
    gap: 10px;
    position: relative; z-index: 1;
  }
  .tile {
    border-radius: 14px;
    cursor: pointer;
    position: relative;
    transition: transform 0.08s, filter 0.15s, box-shadow 0.15s;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08);
    filter: brightness(0.55) saturate(0.8);
  }
  .tile:hover:not(.locked) { filter: brightness(0.75) saturate(0.9); }
  .tile.active {
    filter: brightness(1.3) saturate(1.2);
    box-shadow: 0 0 30px currentColor, inset 0 0 0 2px rgba(255,255,255,0.4);
    transform: scale(1.04);
  }
  .tile.wrong { filter: brightness(1.1) saturate(1.4) hue-rotate(0deg); box-shadow: 0 0 26px var(--red); }
  .t0 { background: #3b82f6; color: #3b82f6; }
  .t1 { background: #f59e0b; color: #f59e0b; }
  .t2 { background: #22c55e; color: #22c55e; }
  .t3 { background: #ef4444; color: #ef4444; }
  .t4 { background: #7dd3fc; color: #7dd3fc; }
  .t5 { background: #2563eb; color: #2563eb; }
  .t6 { background: #ca8a04; color: #ca8a04; }
  .t7 { background: #a855f7; color: #a855f7; }
  .t8 { background: #5eead4; color: #5eead4; }

  .status-line {
    text-align: center; margin: 14px 0 6px; font-weight: 700; font-size: 0.95rem;
    color: var(--cyan); min-height: 1.4em;
  }

  .control-bar {
    margin-top: 10px;
    background: linear-gradient(180deg, #3a2c1c, #241a10);
    border: 1px solid #4a3a24;
    border-radius: 12px;
    padding: 12px 14px;
    display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: center;
  }
  .control-group { display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .control-group .cg-label { font-size: 0.62rem; letter-spacing: 1px; color: #d8c9a8; }
  .pill-group { display: flex; background: #1a130a; border: 1px solid #4a3a24; border-radius: 999px; padding: 3px; gap: 2px; }
  .pill-group button {
    background: transparent; border: none; color: #b8a888; font-size: 0.72rem; font-weight: 700;
    padding: 6px 12px; border-radius: 999px; cursor: pointer; transition: 0.15s;
  }
  .pill-group button.active { background: linear-gradient(90deg, var(--cyan), #7ffcef); color: #04231f; }

  .start-btn {
    background: linear-gradient(180deg, #ff6b6b, #d43a4a);
    color: #fff; border: none; border-radius: 12px; font-weight: 900;
    padding: 12px 18px; cursor: pointer; font-size: 0.8rem; letter-spacing: 0.5px;
    box-shadow: 0 4px 0 #8f2632, 0 6px 14px rgba(0,0,0,0.4);
  }
  .start-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #8f2632; }
  .start-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .bottom-actions { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
  .action-btn {
    background: #0a0d18; border: 1px solid #333b5c; color: var(--cyan);
    padding: 9px 20px; border-radius: 999px; font-weight: 700; font-size: 0.8rem; cursor: pointer;
  }
  .action-btn.settings { color: var(--pink); }
  .action-btn:hover { filter: brightness(1.3); }

  /* Shared arcade styling */
  html, body {
    background:
      radial-gradient(circle at 50% 0%, rgba(255, 47, 208, 0.15), transparent 55%),
      radial-gradient(circle at 50% 100%, rgba(0, 240, 255, 0.12), transparent 60%),
      var(--bg);
    font-family: 'Orbitron', sans-serif;
  }
  body { padding: 24px 12px; }
  .cabinet {
    max-width: 1100px;
    background: linear-gradient(180deg, #161638 0%, #0d0d24 100%);
    border-radius: 28px;
    padding: 32px 24px 24px;
    border: 3px solid transparent;
    background-clip: padding-box;
    box-shadow:
      0 0 0 3px rgba(0, 240, 255, 0.5),
      0 0 30px rgba(0, 240, 255, 0.35),
      0 0 60px rgba(255, 47, 208, 0.2),
      inset 0 0 40px rgba(0, 0, 0, 0.6);
  }
  .back-link {
    display: inline-block;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
    letter-spacing: 0.5px;
    margin-bottom: 16px;
  }
  .back-link:hover { color: var(--cyan); }
  .header-screen {
    background: transparent;
    border: 0;
    box-shadow: none;
    padding: 8px 0 24px;
  }
  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 1.6rem;
    letter-spacing: 2px;
    filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.5));
  }
  .panel, .score-box, .stat-box {
    background: var(--surface);
    border-color: rgba(255,255,255,0.15);
    border-radius: 8px;
  }
  .screen {
    background: #05050f;
    border: 2px solid rgba(0, 240, 255, 0.3);
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.7);
  }
  .screen::before {
    inset: 12px;
    border-color: rgba(0, 240, 255, 0.55);
  }
  .control-bar {
    background: var(--surface);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 8px;
  }
  .cg-label, .score-box .label, .stat-box .label { font-family: 'Orbitron', sans-serif; }
  .pill-group {
    background: var(--surface);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 0;
    gap: 0;
  }
  .pill-group button {
    font-family: 'Orbitron', sans-serif;
    border-radius: 0;
    padding: 9px 12px;
  }
  .pill-group button.active {
    background: var(--surface);
    color: var(--cyan);
    box-shadow: 0 0 14px -3px var(--cyan);
  }
  .start-btn {
    font-family: 'Press Start 2P', monospace;
    background: transparent;
    color: var(--primary);
    border: 2px solid var(--primary);
    border-radius: 8px;
    box-shadow: 0 0 20px -4px var(--primary);
  }
  .action-btn {
    font-family: 'Orbitron', sans-serif;
    background: transparent;
    border: 2px solid var(--muted);
    border-radius: 8px;
    color: var(--muted);
  }
  .action-btn.settings { color: var(--secondary); border-color: var(--secondary); }

  @media (max-width: 460px) {
    .grid { grid-template-columns: repeat(3, 82px); grid-template-rows: repeat(3, 82px); }
  }
</style>
</head>
<body>

<div class="cabinet">
  <span class="bolt tl"></span><span class="bolt tr"></span>
  <span class="bolt bl"></span><span class="bolt br"></span>
  <a href="../../index.html" class="back-link">&larr; Back to Menu</a>

  <div class="header-screen">
    <h1>PATTERN RECALL</h1>
  </div>

  <div class="info-bar">
    <div class="panel hint" id="hintText">Watch the sequence, then repeat it back!</div>

    <div class="panel" style="min-width:auto; flex:0 0 auto;">
      <div class="score-pair">
        <div class="score-box you">
          <div class="label">YOU</div>
          <div class="value" id="youScore">0</div>
        </div>
        <div class="score-box opp" id="oppBox">
          <div class="label" id="oppLabel">AI</div>
          <div class="value" id="oppScore">0</div>
        </div>
      </div>
      <div class="turn-tag" id="turnTag">YOUR TURN</div>
    </div>

    <div class="panel" style="min-width:auto; flex:0 0 auto;">
      <div class="stats-row">
        <div class="stat-box"><div class="label">SCORE</div><div class="value" id="statScore">0</div></div>
        <div class="stat-box"><div class="label">LEVEL</div><div class="value" id="statLevel">0</div></div>
        <div class="stat-box"><div class="label">BEST</div><div class="value" id="statBest">0</div></div>
      </div>
    </div>
  </div>

  <div class="screen">
    <div class="grid" id="grid"></div>
  </div>

  <div class="status-line" id="statusLine">Pick a mode and difficulty, then hit Start.</div>

  <div class="control-bar">
    <div class="control-group">
      <div class="cg-label">GAME MODE</div>
      <div class="pill-group" id="modeGroup">
        <button data-mode="solo" class="active">Solo</button>
        <button data-mode="ai">Vs AI</button>
        <button data-mode="multi">Multiplayer</button>
      </div>
    </div>

    <button class="start-btn" id="startBtn">🚀 START<br>GAME</button>

    <div class="control-group">
      <div class="cg-label">DIFFICULTY</div>
      <div class="pill-group" id="diffGroup">
        <button data-diff="easy">Easy</button>
        <button data-diff="medium" class="active">Medium</button>
        <button data-diff="hard">Hard</button>
      </div>
    </div>
  </div>

  <div class="bottom-actions">
    <button class="action-btn" id="newGameBtn">NEW GAME</button>
    <button class="action-btn settings" id="settingsBtn">SETTINGS</button>
  </div>
</div>

<script>
(function () {
  const TILE_COUNT = 9;
  const DIFFICULTIES = {
    easy:   { flashMs: 750, gapMs: 320, startLen: 3, aiBaseChance: 0.93 },
    medium: { flashMs: 560, gapMs: 230, startLen: 3, aiBaseChance: 0.80 },
    hard:   { flashMs: 400, gapMs: 150, startLen: 4, aiBaseChance: 0.62 }
  };

  const grid = document.getElementById('grid');
  const hintText = document.getElementById('hintText');
  const youScoreEl = document.getElementById('youScore');
  const oppScoreEl = document.getElementById('oppScore');
  const oppLabelEl = document.getElementById('oppLabel');
  const oppBoxEl = document.getElementById('oppBox');
  const turnTag = document.getElementById('turnTag');
  const statScore = document.getElementById('statScore');
  const statLevel = document.getElementById('statLevel');
  const statBest = document.getElementById('statBest');
  const statusLine = document.getElementById('statusLine');
  const modeGroup = document.getElementById('modeGroup');
  const diffGroup = document.getElementById('diffGroup');
  const startBtn = document.getElementById('startBtn');
  const newGameBtn = document.getElementById('newGameBtn');
  const settingsBtn = document.getElementById('settingsBtn');

  let mode = 'solo';
  let difficulty = 'medium';
  let sequence = [];
  let level = 0;
  let score = 0;
  let youWins = 0;
  let oppWins = 0;
  let playing = false;
  let inputLock = true;
  let playerInputIndex = 0;
  let activePlayer = 1; // 1 = You, 2 = second human (multiplayer only)
  let best = Number(localStorage.getItem('patternRecallBest') || 0);

  statBest.textContent = best;

  // build tiles
  const tiles = [];
  for (let i = 0; i < TILE_COUNT; i++) {
    const t = document.createElement('div');
    t.className = `tile t${i} locked`;
    t.dataset.index = i;
    t.addEventListener('click', () => onTileClick(i));
    grid.appendChild(t);
    tiles.push(t);
  }

  function setLocked(locked) {
    tiles.forEach(t => t.classList.toggle('locked', locked));
  }

  function updateHUD() {
    youScoreEl.textContent = youWins;
    oppScoreEl.textContent = oppWins;
    statScore.textContent = score;
    statLevel.textContent = level;
    statBest.textContent = best;

    if (mode === 'solo') {
      oppBoxEl.style.display = 'none';
    } else {
      oppBoxEl.style.display = '';
      oppLabelEl.textContent = mode === 'ai' ? 'AI' : 'P2';
    }
  }

  function config() { return DIFFICULTIES[difficulty]; }

  modeGroup.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn || playing) return;
    [...modeGroup.children].forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    updateHUD();
    statusLine.textContent = "Pick a mode and difficulty, then hit Start.";
  });

  diffGroup.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn || playing) return;
    [...diffGroup.children].forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    difficulty = btn.dataset.diff;
  });

  startBtn.addEventListener('click', startGame);
  newGameBtn.addEventListener('click', () => { endGame(false); startGame(); });
  settingsBtn.addEventListener('click', () => {
    statusLine.textContent = "Change mode/difficulty from the panel below, then Start Game.";
  });

  function startGame() {
    playing = true;
    startBtn.disabled = true;
    youWins = 0; oppWins = 0; score = 0;
    sequence = [];
    level = 0;
    activePlayer = 1;
    updateHUD();
    nextRound();
  }

  function endGame(showMsg = true) {
    playing = false;
    startBtn.disabled = false;
    inputLock = true;
    setLocked(true);
    if (showMsg) statusLine.textContent = `Game over — you reached level ${level}. Final: You ${youWins} · ${mode==='solo'?'':oppLabelEl.textContent+' '+oppWins}`;
  }

  function nextRound() {
    const cfg = config();
    const startLen = cfg.startLen;
    if (sequence.length === 0) {
      for (let i = 0; i < startLen; i++) sequence.push(Math.floor(Math.random() * TILE_COUNT));
    } else {
      sequence.push(Math.floor(Math.random() * TILE_COUNT));
    }
    level = sequence.length - startLen + 1;
    updateHUD();
    activePlayer = 1;
    turnTag.textContent = 'WATCH THE SEQUENCE';
    playSequence();
  }

  function playSequence() {
    inputLock = true;
    setLocked(true);
    const cfg = config();
    let i = 0;
    statusLine.textContent = `Level ${level} — memorize ${sequence.length} squares…`;
    const interval = setInterval(() => {
      if (i > 0) tiles[sequence[i - 1]].classList.remove('active');
      if (i >= sequence.length) {
        clearInterval(interval);
        setTimeout(beginPlayerTurn, 200);
        return;
      }
      tiles[sequence[i]].classList.add('active');
      ArcadeSound.play('light');
      i++;
    }, cfg.flashMs + cfg.gapMs);
  }

  function beginPlayerTurn() {
    playerInputIndex = 0;
    inputLock = false;
    setLocked(false);
    if (mode === 'multi' && activePlayer === 2) {
      turnTag.textContent = "PLAYER 2's TURN";
      statusLine.textContent = "Player 2: repeat the sequence!";
    } else {
      turnTag.textContent = 'YOUR TURN';
      statusLine.textContent = "Your turn — repeat the sequence!";
    }
  }

  function onTileClick(i) {
    if (inputLock || !playing) return;
    const expected = sequence[playerInputIndex];
    flashClick(i, i === expected);

    if (i !== expected) {
      handleTurnFail();
      return;
    }
    playerInputIndex++;
    if (playerInputIndex === sequence.length) {
      handleTurnSuccess();
    }
  }

  function flashClick(i, correct) {
    ArcadeSound.play(correct ? 'light' : 'error');
    tiles[i].classList.add(correct ? 'active' : 'wrong');
    setTimeout(() => tiles[i].classList.remove('active', 'wrong'), 220);
  }

  function handleTurnSuccess() {
    inputLock = true;
    setLocked(true);

    if (mode === 'solo') {
      score += level * 10;
      if (level > best) { best = level; localStorage.setItem('patternRecallBest', best); }
      updateHUD();
      statusLine.textContent = "Nice! Next round coming up…";
      ArcadeSound.play('success');
      setTimeout(nextRound, 700);
      return;
    }

    if (mode === 'multi' && activePlayer === 1) {
      // hand off to player 2 with the same sequence
      activePlayer = 2;
      setTimeout(beginPlayerTurn, 500);
      return;
    }

    // ai mode: after human succeeds, AI attempts
    if (mode === 'ai' && activePlayer === 1) {
      youWins++; // human cleared their attempt this round
      score += level * 10;
      if (level > best) { best = level; localStorage.setItem('patternRecallBest', best); }
      updateHUD();
      turnTag.textContent = "AI'S TURN";
      statusLine.textContent = "AI is attempting the sequence…";
      setTimeout(aiAttempt, 700);
      return;
    }

    // multi mode: player 2 also succeeded -> round fully cleared by both
    if (mode === 'multi' && activePlayer === 2) {
      youWins++; oppWins++; // both hold the round
      score += level * 10;
      if (level > best) { best = level; localStorage.setItem('patternRecallBest', best); }
      updateHUD();
      statusLine.textContent = "Both cleared it! Sequence grows…";
      setTimeout(nextRound, 700);
      return;
    }
  }

  function handleTurnFail() {
    inputLock = true;
    setLocked(true);

    if (mode === 'solo') {
      endGame(true);
      return;
    }

    if (mode === 'ai') {
      if (activePlayer === 1) {
        // human failed first — AI wins the round automatically
        oppWins++;
        updateHUD();
        endGame(true);
      }
      return;
    }

    if (mode === 'multi') {
      if (activePlayer === 1) {
        // player 1 failed, let player 2 try same sequence
        activePlayer = 2;
        statusLine.textContent = "Player 1 slipped! Player 2, your shot at the same sequence.";
        setTimeout(beginPlayerTurn, 700);
      } else {
        // player 2 failed too — round over
        endGame(true);
      }
      return;
    }
  }

  function aiAttempt() {
    const cfg = config();
    const chance = Math.max(0.3, cfg.aiBaseChance - level * 0.02);
    let i = 0;
    const willFailAt = (Math.random() < chance) ? -1 : Math.floor(Math.random() * sequence.length);

    const interval = setInterval(() => {
      if (i >= sequence.length) {
        clearInterval(interval);
        // AI succeeded fully
        oppWins++;
        updateHUD();
        statusLine.textContent = "AI matched it! Sequence grows…";
        setTimeout(nextRound, 700);
        return;
      }
      const correct = i !== willFailAt;
      flashClick(sequence[i], correct);
      if (!correct) {
        clearInterval(interval);
        youWins++; // AI messed up, point to you
        updateHUD();
        statusLine.textContent = "AI made a mistake — point to you!";
        setTimeout(nextRound, 900);
        return;
      }
      i++;
    }, config().flashMs + 150);
  }

  updateHUD();
})();
</script>
</body>
</html>
